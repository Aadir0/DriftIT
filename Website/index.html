<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriftIT — Global Leaderboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        
        <!-- Top Navbar / Header -->
        <header class="app-header">
            <div class="brand">
                <h1 class="brand-title">DriftIT</h1>
                <span class="badge-live">
                    <span class="live-dot"></span> Live Leaderboard
                </span>
            </div>
            
            <div class="header-actions">
                <div class="search-wrap">
                    <input type="text" id="searchInput" placeholder="Search driver..." autocomplete="off">
                </div>
                <button class="btn-refresh" id="refreshBtn" title="Refresh Leaderboard">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="23 4 23 10 17 10"></polyline>
                        <polyline points="1 20 1 14 7 14"></polyline>
                        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                    </svg>
                    <span>Refresh</span>
                </button>
            </div>
        </header>

        <!-- Main Layout: Sidebar & Table -->
        <main class="main-layout">
            
            <!-- Left Sidebar: Selected Driver Stage Breakdown -->
            <aside class="card sidebar-card">
                <div class="card-header">
                    <h2 class="card-title">Stage Breakdown</h2>
                </div>

                <div class="driver-profile" id="driverProfile">
                    <div class="driver-header">
                        <span class="rank-badge" id="sidebarRank">#1</span>
                        <div class="driver-title-group">
                            <div class="driver-name" id="sidebarDriverName">Select a driver</div>
                            <div class="driver-date" id="sidebarDate">--</div>
                        </div>
                        <span class="grade-badge" id="sidebarGrade">[--]</span>
                    </div>
                </div>

                <div class="table-container stages-table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th class="col-stage">STAGE</th>
                                <th class="col-time text-right">TIME</th>
                                <th class="col-deaths text-right">DEATHS</th>
                            </tr>
                        </thead>
                        <tbody id="stagesList">
                            <tr>
                                <td colspan="3" class="empty-message">Select a run from the leaderboard</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </aside>

            <!-- Right Main Area: Leaderboard Table -->
            <section class="card leaderboard-card">
                <div class="card-header">
                    <h2 class="card-title">Top 200 Runs</h2>
                    <span class="record-count" id="recordCount">Loading...</span>
                </div>

                <div class="table-container main-table-container" id="boardScrollArea">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th class="col-rank">RANK</th>
                                <th class="col-driver">DRIVER</th>
                                <th class="col-total-time text-right">TOTAL TIME</th>
                                <th class="col-total-deaths text-right">DEATHS</th>
                                <th class="col-grade text-center">GRADE</th>
                                <th class="col-date text-right">DATE</th>
                            </tr>
                        </thead>
                        <tbody id="leaderboardRows">
                            <tr>
                                <td colspan="6" class="loading-message">Loading leaderboard data...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>

        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
